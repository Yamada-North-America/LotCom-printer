name: Build release
run-name: Stable release ${{ inputs.version || github.ref_name }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version without v (for example, 1.0.5); always builds stable'
        required: true
        type: string
  push:
    tags:
      - 'v*'
      # Continue to support the repository's historical, unprefixed release tags.
      - '[0-9]*.[0-9]*.[0-9]*'

permissions:
  contents: read

concurrency:
  group: ${{ github.repository }}-stable-release
  cancel-in-progress: false

env:
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
        working-directory: source/LotCom-printer
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
      commit: ${{ steps.release.outputs.commit }}
      libraries: ${{ steps.provenance.outputs.libraries }}
    steps:
      - name: Check out stable or the tagged commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && 'stable' || github.sha }}
          path: source/LotCom-printer
          fetch-depth: 0
          persist-credentials: false

      - name: Validate version and stable ancestry
        id: release
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: ./.github/scripts/resolve-release.ps1

      - name: Reject an existing release under either tag convention
        uses: actions/github-script@v7
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        with:
          script: |
            for (const tag of [process.env.RELEASE_VERSION, `v${process.env.RELEASE_VERSION}`]) {
              try {
                await github.rest.repos.getReleaseByTag({ ...context.repo, tag });
                core.setFailed(`Release ${tag} already exists. Use a new version, or delete the incomplete draft before retrying.`);
              } catch (error) {
                if (error.status !== 404) throw error;
              }
            }

      - name: Check out the required sibling LotCom libraries
        uses: actions/checkout@v4
        with:
          repository: Yamada-North-America/LotCom-libraries
          ref: ef2da369b7bda48abc0d3b073625754dcae10bd8
          path: source/LotCom-libraries
          persist-credentials: false

      - name: Record dependency revision
        id: provenance
        run: |
          $sha = git -C ../LotCom-libraries rev-parse HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Cannot resolve the library revision.' }
          "libraries=$sha" >> $env:GITHUB_OUTPUT

      - name: Install the application SDK and WiX runtime
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
          cache: true
          cache-dependency-path: source/LotCom-printer/LotCoMPrinter/packages.lock.json

      - name: Install the MAUI Windows workload
        run: |
          dotnet workload install maui-windows
          if ($LASTEXITCODE -ne 0) { throw 'MAUI Windows workload installation failed.' }

      - name: Install pinned WiX and required extensions
        run: |
          dotnet tool install --global wix --version 4.0.6 --allow-roll-forward
          if ($LASTEXITCODE -ne 0) { throw 'WiX installation failed.' }
          foreach ($extension in @('WixToolset.UI.wixext', 'WixToolset.Util.wixext')) {
            wix extension add --global "$extension/4.0.6"
            if ($LASTEXITCODE -ne 0) { throw "WiX extension installation failed: $extension" }
          }

      - name: Publish the application and build release packages
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: ./.github/scripts/build-release.ps1 -Version $env:RELEASE_VERSION

      - name: Upload release packages
        uses: actions/upload-artifact@v4
        with:
          name: LotComPrinter-${{ steps.release.outputs.version }}-win-x64
          path: source/LotCom-printer/artifacts/packages/*
          if-no-files-found: error
          retention-days: 30

  release:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out release script from the exact built stable commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.build.outputs.commit }}
          path: source
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          name: LotComPrinter-${{ needs.build.outputs.version }}-win-x64
          path: packages

      - name: Create draft release with MSI, ZIP, and checksums
        uses: actions/github-script@v7
        env:
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.build.outputs.commit }}
          LIBRARIES_COMMIT: ${{ needs.build.outputs.libraries }}
        with:
          script: |
            const publish = require('./source/.github/scripts/publish-release.cjs');
            await publish({ github, context, core });
